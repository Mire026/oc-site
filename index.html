<!DOCTYPE html>
<html>
  <head>
    <title>Character Card</title>
    <style>
      body {
        background-color: #1e1e2e;
        font-family: Arial, sans-serif;
      }
      .card {
        background-color: white;
        width: 300px;
        padding: 20px;
        border-radius: 12px;
        margin: 40px auto;
        overflow-wrap: anywhere;
      }
      img {
        width: 100%;
        border-radius: 8px;
      }
      .form {
        background-color: white;
        width: 300px;
        padding: 20px;
        border-radius: 12px;
        margin: 40px auto;
      }
      .form input,
      .form textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
        font-family: inherit;
      }
      .row {
        margin-bottom: 8px;
      }
      .extraRow {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 10px;
      }
      .multiline {
        white-space: pre-wrap;
      }
      .extra {
        margin-top: 12px;
      }
      .extra p {
        margin: 4px 0 0 0;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="form" id="authBox">
      <p id="userInfo">Not logged in</p>
      <button id="loginBtn" onclick="loginWithDiscord()">Log in with Discord</button>
      <button id="logoutBtn" onclick="logout()" style="display: none;">Log out</button>
    </div>

    <div class="card" id="card">
      <img id="cardImage" src="kai.jpg" alt="Character picture" crossorigin="anonymous">
      <h1 id="cardName"></h1>
      <p>Age: <span id="cardAge"></span></p>
      <p>Gender: <span id="cardGender"></span></p>
      <p>Backstory:</p>
      <p class="multiline" id="cardStory"></p>
      <div id="cardExtra"></div>
    </div>

    <div class="form" id="formBox">
      <input id="nameInput" placeholder="Name" maxlength="100" value="Kai" oninput="renderCard()">
      <input id="ageInput" placeholder="Age" maxlength="50" value="24" oninput="renderCard()">
      <input id="genderInput" placeholder="Gender" maxlength="50" value="Male" oninput="renderCard()">
      <textarea id="storyInput" placeholder="Backstory" rows="4" maxlength="5000" oninput="renderCard()">A wandering knight.</textarea>

      <h4>Extra fields</h4>
      <div id="extraFields"></div>
      <button onclick="addExtraRow('', '')">+ Custom field</button>
      <button onclick="addExtraRow('Personality', '')">+ Personality</button>
      <button onclick="addExtraRow('Appearance', '')">+ Appearance</button>
      <button onclick="addExtraRow('Species', '')">+ Species</button>
      <button onclick="addExtraRow('Abilities', '')">+ Abilities</button>
      <button onclick="addExtraRow('Relationships', '')">+ Relationships</button>

      <h4>Picture</h4>
      <input id="imageInput" type="file" accept="image/*" onchange="pickImage()">

      <button onclick="saveCharacter()">Save character</button>
      <button onclick="downloadCard()">Download card as image</button>
      <button onclick="newCharacter()">New character</button>
      <p id="status"></p>
      <input id="shareLink" readonly placeholder="Your share link appears here">
      <button onclick="copyLink()">Copy link</button>
    </div>

    <div class="form" id="myBox" style="display: none;">
      <h3>My characters</h3>
      <div id="myList"></div>
    </div>

    <div class="form" id="viewerBox" style="display: none;">
      <button onclick="downloadCard()">Download card as image</button>
      <p><a href="./">Make your own card</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      const SUPABASE_URL = "https://zztddikhhoiiquygszmu.supabase.co";
      const SUPABASE_KEY = "sb_publishable_4voRPIIlS73ex4K8woa0ow_Nbzwbxq7";
      const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const BUCKET = "character-images";
      const MAX_FIELDS = 20;
      const MAX_LABEL = 40;
      const MAX_VALUE = 2000;

      const isViewer = new URLSearchParams(window.location.search).has("id");
      let currentUser = null;
      let editingId = null;
      let pendingImageBlob = null;
      let currentImageUrl = null;

      // ---------- Login ----------

      async function loginWithDiscord() {
        const { error } = await db.auth.signInWithOAuth({
          provider: "discord",
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) {
          document.getElementById("status").textContent = "Login failed: " + error.message;
        }
      }

      async function logout() {
        await db.auth.signOut();
      }

      function showUser(user) {
        currentUser = user;
        if (isViewer) {
          return;
        }

        const info = document.getElementById("userInfo");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const myBox = document.getElementById("myBox");

        if (user) {
          const meta = user.user_metadata || {};
          info.textContent = "Logged in as " + (meta.full_name || meta.name || "Discord user");
          loginBtn.style.display = "none";
          logoutBtn.style.display = "";
          myBox.style.display = "block";
          loadMyCharacters();
        } else {
          info.textContent = "Not logged in";
          loginBtn.style.display = "";
          logoutBtn.style.display = "none";
          myBox.style.display = "none";
          editingId = null;
        }
      }

      db.auth.onAuthStateChange(function (event, session) {
        setTimeout(function () {
          showUser(session ? session.user : null);
        }, 0);
      });

      // ---------- Extra fields ----------

      function addExtraRow(label, value) {
        const container = document.getElementById("extraFields");

        if (container.children.length >= MAX_FIELDS) {
          document.getElementById("status").textContent =
            "You can have up to " + MAX_FIELDS + " extra fields.";
          return;
        }

        const row = document.createElement("div");
        row.className = "extraRow";

        const labelInput = document.createElement("input");
        labelInput.className = "extraLabel";
        labelInput.placeholder = "Label (for example: Personality)";
        labelInput.maxLength = MAX_LABEL;
        labelInput.value = label || "";
        labelInput.oninput = renderCard;

        const valueInput = document.createElement("textarea");
        valueInput.className = "extraValue";
        valueInput.placeholder = "Details";
        valueInput.rows = 3;
        valueInput.maxLength = MAX_VALUE;
        valueInput.value = value || "";
        valueInput.oninput = renderCard;

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove field";
        removeBtn.onclick = function () {
          row.remove();
          renderCard();
        };

        row.appendChild(labelInput);
        row.appendChild(valueInput);
        row.appendChild(removeBtn);
        container.appendChild(row);
        renderCard();
      }

      function getExtraFields() {
        const result = [];
        const rows = document.querySelectorAll("#extraFields .extraRow");

        rows.forEach(function (row) {
          const label = row.querySelector(".extraLabel").value.trim();
          const value = row.querySelector(".extraValue").value.trim();
          if (label !== "" && value !== "") {
            result.push({ label: label, value: value });
          }
        });

        return result;
      }

      function setExtraFields(list) {
        document.getElementById("extraFields").textContent = "";
        if (!Array.isArray(list)) {
          return;
        }
        list.forEach(function (field) {
          if (field && field.label !== undefined && field.value !== undefined) {
            addExtraRow(String(field.label), String(field.value));
          }
        });
      }

      // ---------- Drawing the card ----------

      function renderCard() {
        const name = document.getElementById("nameInput").value.trim();
        const age = document.getElementById("ageInput").value.trim();
        const gender = document.getElementById("genderInput").value.trim();
        const story = document.getElementById("storyInput").value.trim();

        document.getElementById("cardName").textContent = name || "Character name";
        document.getElementById("cardAge").textContent = age || "?";
        document.getElementById("cardGender").textContent = gender || "?";
        document.getElementById("cardStory").textContent = story || "No backstory yet.";

        const box = document.getElementById("cardExtra");
        box.textContent = "";

        getExtraFields().forEach(function (field) {
          const wrapper = document.createElement("div");
          wrapper.className = "extra";

          const title = document.createElement("strong");
          title.textContent = field.label;

          const body = document.createElement("p");
          body.textContent = field.value;

          wrapper.appendChild(title);
          wrapper.appendChild(body);
          box.appendChild(wrapper);
        });
      }

      function fillForm(data) {
        document.getElementById("nameInput").value = data.name || "";
        document.getElementById("ageInput").value = data.age || "";
        document.getElementById("genderInput").value = data.gender || "";
        document.getElementById("storyInput").value = data.backstory || "";
        setExtraFields(data.extra);
        renderCard();
      }

      // ---------- Pictures ----------

      function showImage(url) {
        const img = document.getElementById("cardImage");
        if (url) {
          img.src = url;
          img.style.display = "";
        } else {
          img.style.display = "none";
        }
      }

      function resizeImage(file, maxSize) {
        return new Promise(function (resolve, reject) {
          const img = new Image();
          const url = URL.createObjectURL(file);

          img.onload = function () {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);

            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;

            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);

            URL.revokeObjectURL(url);
            canvas.toBlob(function (blob) {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error("Could not process the picture"));
              }
            }, "image/jpeg", 0.85);
          };

          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("Could not read the picture"));
          };

          img.src = url;
        });
      }

      async function pickImage() {
        const file = document.getElementById("imageInput").files[0];
        pendingImageBlob = null;
        if (!file) {
          return;
        }
        try {
          pendingImageBlob = await resizeImage(file, 800);
          showImage(URL.createObjectURL(pendingImageBlob));
        } catch (err) {
          document.getElementById("status").textContent = err.message;
        }
      }

      async function removeImage(url) {
        if (!url) {
          return;
        }
        const marker = "/" + BUCKET + "/";
        const index = url.indexOf(marker);
        if (index === -1) {
          return;
        }
        const path = url.slice(index + marker.length);
        await db.storage.from(BUCKET).remove([path]);
      }

      // ---------- Download and reset ----------

      function downloadCard() {
        html2canvas(document.getElementById("card"), { useCORS: true }).then(function (canvas) {
          const link = document.createElement("a");
          link.download = "character-card.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        });
      }

      function newCharacter() {
        editingId = null;
        pendingImageBlob = null;
        currentImageUrl = null;
        showImage(null);
        document.getElementById("imageInput").value = "";
        document.getElementById("nameInput").value = "";
        document.getElementById("ageInput").value = "";
        document.getElementById("genderInput").value = "";
        document.getElementById("storyInput").value = "";
        document.getElementById("extraFields").textContent = "";
        document.getElementById("shareLink").value = "";
        document.getElementById("status").textContent = "";
        renderCard();
      }

      // ---------- Saving ----------

      async function saveCharacter() {
        const status = document.getElementById("status");

        if (!currentUser) {
          status.textContent = "Please log in with Discord first.";
          return;
        }

        const name = document.getElementById("nameInput").value.trim();
        if (name === "") {
          status.textContent = "Please give your character a name.";
          return;
        }

        status.textContent = "Saving...";

        const file = document.getElementById("imageInput").files[0];
        if (file && !pendingImageBlob) {
          try {
            pendingImageBlob = await resizeImage(file, 800);
          } catch (err) {
            status.textContent = err.message;
            return;
          }
        }

        const fields = {
          name: name,
          age: document.getElementById("ageInput").value.trim(),
          gender: document.getElementById("genderInput").value.trim(),
          backstory: document.getElementById("storyInput").value.trim(),
          extra: getExtraFields()
        };

        let newImagePath = null;
        if (pendingImageBlob) {
          newImagePath = currentUser.id + "/" + crypto.randomUUID() + ".jpg";
          const upload = await db.storage
            .from(BUCKET)
            .upload(newImagePath, pendingImageBlob, { contentType: "image/jpeg" });

          if (upload.error) {
            status.textContent = "Could not upload the picture: " + upload.error.message;
            return;
          }

          fields.image_url = db.storage.from(BUCKET).getPublicUrl(newImagePath).data.publicUrl;
        }

        let result;
        if (editingId) {
          result = await db
            .from("characters")
            .update(fields)
            .eq("id", editingId)
            .select()
            .single();
        } else {
          result = await db
            .from("characters")
            .insert(fields)
            .select()
            .single();
        }

        if (result.error) {
          if (newImagePath) {
            await db.storage.from(BUCKET).remove([newImagePath]);
          }
          status.textContent = "Could not save: " + result.error.message;
          return;
        }

        if (pendingImageBlob) {
          if (currentImageUrl) {
            await removeImage(currentImageUrl);
          }
          currentImageUrl = fields.image_url;
          pendingImageBlob = null;
          document.getElementById("imageInput").value = "";
        }

        editingId = result.data.id;
        const link = window.location.origin + window.location.pathname + "?id=" + result.data.id;
        document.getElementById("shareLink").value = link;
        status.textContent = "Saved!";
        loadMyCharacters();
      }

      function copyLink() {
        const link = document.getElementById("shareLink").value;
        if (link !== "") {
          navigator.clipboard.writeText(link);
          document.getElementById("status").textContent = "Link copied!";
        }
      }

      // ---------- My characters ----------

      async function loadMyCharacters() {
        if (!currentUser) {
          return;
        }

        const list = document.getElementById("myList");
        const { data, error } = await db
          .from("characters")
          .select("id, name")
          .eq("owner_id", currentUser.id)
          .order("created_at", { ascending: false });

        list.textContent = "";

        if (error) {
          list.textContent = "Could not load: " + error.message;
          return;
        }

        if (!data || data.length === 0) {
          list.textContent = "No characters yet.";
          return;
        }

        data.forEach(function (character) {
          const row = document.createElement("div");
          row.className = "row";

          const nameSpan = document.createElement("span");
          nameSpan.textContent = character.name + " ";

          const editBtn = document.createElement("button");
          editBtn.textContent = "Edit";
          editBtn.onclick = function () {
            editCharacter(character.id);
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = function () {
            deleteCharacter(character.id);
          };

          row.appendChild(nameSpan);
          row.appendChild(editBtn);
          row.appendChild(deleteBtn);
          list.appendChild(row);
        });
      }

      async function editCharacter(id) {
        const { data, error } = await db
          .from("characters")
          .select("*")
          .eq("id", id)
          .single();

        if (error || !data) {
          document.getElementById("status").textContent = "Could not load that character.";
          return;
        }

        editingId = data.id;
        pendingImageBlob = null;
        currentImageUrl = data.image_url;
        document.getElementById("imageInput").value = "";
        showImage(data.image_url);
        fillForm(data);
        document.getElementById("shareLink").value =
          window.location.origin + window.location.pathname + "?id=" + data.id;
        document.getElementById("status").textContent = "Editing " + data.name;
      }

      async function deleteCharacter(id) {
        if (!confirm("Delete this character? This can't be undone.")) {
          return;
        }

        const found = await db
          .from("characters")
          .select("image_url")
          .eq("id", id)
          .single();

        const { error } = await db
          .from("characters")
          .delete()
          .eq("id", id);

        if (error) {
          document.getElementById("status").textContent = "Could not delete: " + error.message;
          return;
        }

        if (found.data && found.data.image_url) {
          await removeImage(found.data.image_url);
        }

        if (editingId === id) {
          newCharacter();
        }
        loadMyCharacters();
      }

      // ---------- Viewing a shared link ----------

      async function loadCharacter() {
        const id = new URLSearchParams(window.location.search).get("id");
        if (!id) {
          return;
        }

        document.getElementById("authBox").style.display = "none";
        document.getElementById("formBox").style.display = "none";
        document.getElementById("viewerBox").style.display = "block";
        showImage(null);
        document.getElementById("cardName").textContent = "Loading...";
        document.getElementById("cardAge").textContent = "";
        document.getElementById("cardGender").textContent = "";
        document.getElementById("cardStory").textContent = "";
        document.getElementById("cardExtra").textContent = "";

        const { data, error } = await db
          .from("characters")
          .select("*")
          .eq("id", id)
          .single();

        if (error || !data) {
          document.getElementById("cardName").textContent = "Character not found";
          return;
        }

        showImage(data.image_url);
        fillForm(data);
      }

      renderCard();
      loadCharacter();
    </script>
  </body>
</html>
