<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Character Card</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: #12121c;
        color: #e8e8f0;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.4;
      }
      .page {
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .topbar p {
        margin: 0;
      }


      /* ----- Login page ----- */
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
      }
      #loginPage.active {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .loginBox {
        width: 100%;
        max-width: 400px;
        text-align: center;
        background-color: #1e1e2e;
        border: 1px solid #32324a;
        border-radius: 16px;
        padding: 32px 24px;
      }
      .loginBox h1 {
        margin: 0 0 8px 0;
        font-size: 30px;
      }
      .loginBox p {
        margin: 0 0 24px 0;
        opacity: 0.8;
      }
      .loginBox button {
        width: 100%;
        padding: 14px;
        font-size: 17px;
      }
      #loginError {
        min-height: 1.4em;
        margin: 12px 0 0 0;
        color: #ff8a8a;
      }
      #loadingScreen {
        text-align: center;
        padding: 40vh 16px 0 16px;
        opacity: 0.7;
      }

      /* ----- Layout ----- */
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }
      @media (min-width: 820px) {
        .layout {
          grid-template-columns: 380px 1fr;
          align-items: start;
        }
        .cardCol {
          position: sticky;
          top: 16px;
        }
      }
      body.viewer .layout {
        grid-template-columns: 1fr;
        max-width: 420px;
        margin: 0 auto;
      }
      body.viewer .cardCol {
        position: static;
      }
      body.viewer .editorCol {
        display: none;
      }

      /* ----- Panels, inputs, buttons ----- */
      .panel {
        background-color: #1e1e2e;
        border: 1px solid #32324a;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .panel h3,
      .panel h4 {
        margin: 0 0 10px 0;
      }
      .panel input,
      .panel textarea,
      .panel select {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 10px;
        font-family: inherit;
        font-size: 16px;
        color: #f0f0f8;
        background-color: #2a2a3c;
        border: 1px solid #3a3a52;
        border-radius: 8px;
      }
      .panel input[type="file"] {
        padding: 8px;
      }
      button {
        padding: 10px 14px;
        font-family: inherit;
        font-size: 15px;
        color: white;
        background-color: #6c63ff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button.secondary {
        background-color: #3a3a52;
      }
      button.danger {
        background-color: #a32638;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row span {
        overflow-wrap: anywhere;
      }
      .extraRow {
        border: 1px solid #3a3a52;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
      }
      #status {
        min-height: 1.4em;
        margin: 8px 0;
      }

      /* ----- The card ----- */
      .card {
        width: 100%;
        max-width: 380px;
        margin: 0 auto 16px auto;
        padding: 22px;
        border-radius: 16px;
        overflow-wrap: anywhere;
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
        margin-bottom: 14px;
        border-radius: 10px;
      }
      .card h1 {
        margin: 0 0 12px 0;
        font-size: 28px;
        line-height: 1.15;
      }
      .stats {
        display: flex;
        gap: 24px;
        margin-bottom: 4px;
      }
      .stat {
        display: block;
      }
      .label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .value {
        display: block;
        font-size: 16px;
      }
      .section {
        margin-top: 14px;
        padding-top: 12px;
      }
      .section p {
        margin: 4px 0 0 0;
        white-space: pre-wrap;
      }

      /* ----- Template: modern ----- */
      .tpl-modern {
        background-color: #ffffff;
        color: #1f2430;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .tpl-modern h1 {
        color: #3b5bdb;
      }
      .tpl-modern .section {
        border-top: 1px solid #e3e6ee;
      }

      /* ----- Template: fantasy ----- */
      .tpl-fantasy {
        background: linear-gradient(135deg, #f6ebc9, #e6d09a);
        color: #3a2912;
        font-family: Georgia, "Palatino Linotype", "Times New Roman", serif;
        border: 5px double #8a5a20;
      }
      .tpl-fantasy h1 {
        color: #6b3410;
        letter-spacing: 0.04em;
      }
      .tpl-fantasy img {
        border: 3px solid #8a5a20;
      }
      .tpl-fantasy .section {
        border-top: 1px solid #b99556;
      }

      /* ----- Template: dark ----- */
      .tpl-dark {
        background: linear-gradient(160deg, #1a0a0f, #0c0407);
        color: #eadada;
        font-family: Georgia, "Times New Roman", serif;
        border: 1px solid #7a1424;
        box-shadow: 0 0 24px rgba(160, 20, 40, 0.35);
      }
      .tpl-dark h1 {
        color: #d12b45;
      }
      .tpl-dark img {
        border: 2px solid #7a1424;
      }
      .tpl-dark .section {
        border-top: 1px solid #4a1520;
      }
    </style>
  </head>
  <body>
    <div id="loadingScreen" class="screen active">Loading...</div>

    <div id="loginPage" class="screen">
      <div class="loginBox">
        <h1>Character Cards</h1>
        <p>Make a profile card for your roleplay character, save it, and share it with a link.</p>
        <button onclick="loginWithDiscord()">Log in with Discord</button>
        <p id="loginError"></p>
      </div>
    </div>

    <div class="page screen" id="app">
      <div class="topbar" id="authBox">
        <p id="userInfo">Not logged in</p>
        <div>
          <button id="loginBtn" onclick="loginWithDiscord()">Log in with Discord</button>
          <button id="logoutBtn" class="secondary" onclick="logout()" style="display: none;">Log out</button>
        </div>
      </div>

      <div class="layout">
        <div class="cardCol">
          <div class="card tpl-modern" id="card">
            <img id="cardImage" src="" alt="Character picture" crossorigin="anonymous">
            <h1 id="cardName"></h1>
            <div class="stats">
              <div class="stat">
                <span class="label">Age</span>
                <span class="value" id="cardAge"></span>
              </div>
              <div class="stat">
                <span class="label">Gender</span>
                <span class="value" id="cardGender"></span>
              </div>
            </div>
            <div class="section">
              <span class="label">Backstory</span>
              <p id="cardStory"></p>
            </div>
            <div id="cardExtra"></div>
          </div>

          <div class="panel" id="viewerBox" style="display: none;">
            <div class="actions">
              <button onclick="downloadCard()">Download card as image</button>
            </div>
            <p><a href="./" style="color: #9d97ff;">Make your own card</a></p>
          </div>
        </div>

        <div class="editorCol">
          <div class="panel" id="formBox">
            <h3>Character</h3>
            <input id="nameInput" placeholder="Name (for example: Kai)" maxlength="100" oninput="renderCard()">
            <input id="ageInput" placeholder="Age (for example: 24)" maxlength="50" oninput="renderCard()">
            <input id="genderInput" placeholder="Gender" maxlength="50" oninput="renderCard()">
            <textarea id="storyInput" placeholder="Backstory: who is your character?" rows="4" maxlength="5000" oninput="renderCard()"></textarea>

            <h4>Card style</h4>
            <select id="templateInput" onchange="renderCard()">
              <option value="modern">Modern</option>
              <option value="fantasy">Fantasy</option>
              <option value="dark">Dark</option>
            </select>

            <h4>Extra fields</h4>
            <div id="extraFields"></div>
            <div class="actions">
              <button class="secondary" onclick="addExtraRow('', '')">+ Custom field</button>
              <button class="secondary" onclick="addExtraRow('Personality', '')">+ Personality</button>
              <button class="secondary" onclick="addExtraRow('Appearance', '')">+ Appearance</button>
              <button class="secondary" onclick="addExtraRow('Species', '')">+ Species</button>
              <button class="secondary" onclick="addExtraRow('Abilities', '')">+ Abilities</button>
              <button class="secondary" onclick="addExtraRow('Relationships', '')">+ Relationships</button>
            </div>

            <h4>Picture</h4>
            <input id="imageInput" type="file" accept="image/*" onchange="pickImage()">

            <div class="actions">
              <button onclick="saveCharacter()">Save character</button>
              <button class="secondary" onclick="downloadCard()">Download card as image</button>
              <button class="secondary" onclick="newCharacter()">New character</button>
            </div>
            <p id="status"></p>
            <input id="shareLink" readonly placeholder="Your share link appears here">
            <button class="secondary" onclick="copyLink()">Copy link</button>
          </div>

          <div class="panel" id="myBox" style="display: none;">
            <h3>My characters</h3>
            <div id="myList"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      const SUPABASE_URL = "https://zztddikhhoiiquygszmu.supabase.co";
      const SUPABASE_KEY = "sb_publishable_4voRPIIlS73ex4K8woa0ow_Nbzwbxq7";
      const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const BUCKET = "character-images";
      const PLACEHOLDER_IMAGE = "data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20400%20400%27%3E%3Crect%20width%3D%27400%27%20height%3D%27400%27%20fill%3D%27%23d9dce6%27/%3E%3Ccircle%20cx%3D%27200%27%20cy%3D%27150%27%20r%3D%2762%27%20fill%3D%27%23aab0c2%27/%3E%3Cpath%20d%3D%27M70%20380c0-80%2058-130%20130-130s130%2050%20130%20130z%27%20fill%3D%27%23aab0c2%27/%3E%3Ctext%20x%3D%27200%27%20y%3D%27392%27%20font-family%3D%27Arial%27%20font-size%3D%270%27%3E%3C/text%3E%3C/svg%3E";
      const TEMPLATES = ["modern", "fantasy", "dark"];
      const MAX_FIELDS = 20;
      const MAX_LABEL = 40;
      const MAX_VALUE = 2000;

      const isViewer = new URLSearchParams(window.location.search).has("id");
      let currentUser = null;
      let editingId = null;
      let pendingImageBlob = null;
      let currentImageUrl = null;

      if (isViewer) {
        document.body.classList.add("viewer");
      }

      // ---------- Screens ----------

      function showScreen(name) {
        ["loadingScreen", "loginPage", "app"].forEach(function (id) {
          document.getElementById(id).classList.toggle("active", id === name);
        });
      }

      // Shared links go straight to the card; everyone else sees login first.
      if (isViewer) {
        showScreen("app");
      } else {
        // If login never answers, show the login page anyway.
        setTimeout(function () {
          if (document.getElementById("loadingScreen").classList.contains("active")) {
            showScreen("loginPage");
          }
        }, 4000);
      }

      // ---------- Login ----------

      async function loginWithDiscord() {
        const { error } = await db.auth.signInWithOAuth({
          provider: "discord",
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) {
          document.getElementById("loginError").textContent = "Login failed: " + error.message;
        }
      }

      async function logout() {
        await db.auth.signOut();
      }

      function showUser(user) {
        currentUser = user;
        if (isViewer) {
          return;
        }

        showScreen(user ? "app" : "loginPage");

        const info = document.getElementById("userInfo");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const myBox = document.getElementById("myBox");

        if (user) {
          const meta = user.user_metadata || {};
          info.textContent = "Logged in as " + (meta.full_name || meta.name || "Discord user");
          loginBtn.style.display = "none";
          logoutBtn.style.display = "";
          myBox.style.display = "block";
          loadMyCharacters();
        } else {
          info.textContent = "Not logged in";
          loginBtn.style.display = "";
          logoutBtn.style.display = "none";
          myBox.style.display = "none";
          editingId = null;
        }
      }

      db.auth.onAuthStateChange(function (event, session) {
        setTimeout(function () {
          showUser(session ? session.user : null);
        }, 0);
      });

      // ---------- Extra fields ----------

      function addExtraRow(label, value) {
        const container = document.getElementById("extraFields");

        if (container.children.length >= MAX_FIELDS) {
          document.getElementById("status").textContent =
            "You can have up to " + MAX_FIELDS + " extra fields.";
          return;
        }

        const row = document.createElement("div");
        row.className = "extraRow";

        const labelInput = document.createElement("input");
        labelInput.className = "extraLabel";
        labelInput.placeholder = "Label (for example: Personality)";
        labelInput.maxLength = MAX_LABEL;
        labelInput.value = label || "";
        labelInput.oninput = renderCard;

        const valueInput = document.createElement("textarea");
        valueInput.className = "extraValue";
        valueInput.placeholder = "Details";
        valueInput.rows = 3;
        valueInput.maxLength = MAX_VALUE;
        valueInput.value = value || "";
        valueInput.oninput = renderCard;

        const removeBtn = document.createElement("button");
        removeBtn.className = "danger";
        removeBtn.textContent = "Remove field";
        removeBtn.onclick = function () {
          row.remove();
          renderCard();
        };

        row.appendChild(labelInput);
        row.appendChild(valueInput);
        row.appendChild(removeBtn);
        container.appendChild(row);
        renderCard();
      }

      function getExtraFields() {
        const result = [];
        const rows = document.querySelectorAll("#extraFields .extraRow");

        rows.forEach(function (row) {
          const label = row.querySelector(".extraLabel").value.trim();
          const value = row.querySelector(".extraValue").value.trim();
          if (label !== "" && value !== "") {
            result.push({ label: label, value: value });
          }
        });

        return result;
      }

      function setExtraFields(list) {
        document.getElementById("extraFields").textContent = "";
        if (!Array.isArray(list)) {
          return;
        }
        list.forEach(function (field) {
          if (field && field.label !== undefined && field.value !== undefined) {
            addExtraRow(String(field.label), String(field.value));
          }
        });
      }

      // ---------- Drawing the card ----------

      function getTemplate() {
        const value = document.getElementById("templateInput").value;
        return TEMPLATES.includes(value) ? value : "modern";
      }

      function renderCard() {
        const name = document.getElementById("nameInput").value.trim();
        const age = document.getElementById("ageInput").value.trim();
        const gender = document.getElementById("genderInput").value.trim();
        const story = document.getElementById("storyInput").value.trim();

        document.getElementById("card").className = "card tpl-" + getTemplate();
        document.getElementById("cardName").textContent = name || "Character name";
        document.getElementById("cardAge").textContent = age || "?";
        document.getElementById("cardGender").textContent = gender || "?";
        document.getElementById("cardStory").textContent = story || "No backstory yet.";

        const box = document.getElementById("cardExtra");
        box.textContent = "";

        getExtraFields().forEach(function (field) {
          const wrapper = document.createElement("div");
          wrapper.className = "section";

          const title = document.createElement("span");
          title.className = "label";
          title.textContent = field.label;

          const body = document.createElement("p");
          body.textContent = field.value;

          wrapper.appendChild(title);
          wrapper.appendChild(body);
          box.appendChild(wrapper);
        });
      }

      function fillForm(data) {
        document.getElementById("nameInput").value = data.name || "";
        document.getElementById("ageInput").value = data.age || "";
        document.getElementById("genderInput").value = data.gender || "";
        document.getElementById("storyInput").value = data.backstory || "";
        document.getElementById("templateInput").value =
          TEMPLATES.includes(data.template) ? data.template : "modern";
        setExtraFields(data.extra);
        renderCard();
      }

      // ---------- Pictures ----------

      function showImage(url) {
        const img = document.getElementById("cardImage");
        if (url) {
          img.src = url;
          img.style.display = "";
        } else if (isViewer) {
          img.style.display = "none";
        } else {
          img.src = PLACEHOLDER_IMAGE;
          img.style.display = "";
        }
      }

      function resizeImage(file, maxSize) {
        return new Promise(function (resolve, reject) {
          const img = new Image();
          const url = URL.createObjectURL(file);

          img.onload = function () {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);

            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;

            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);

            URL.revokeObjectURL(url);
            canvas.toBlob(function (blob) {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error("Could not process the picture"));
              }
            }, "image/jpeg", 0.85);
          };

          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("Could not read the picture"));
          };

          img.src = url;
        });
      }

      async function pickImage() {
        const file = document.getElementById("imageInput").files[0];
        pendingImageBlob = null;
        if (!file) {
          return;
        }
        try {
          pendingImageBlob = await resizeImage(file, 800);
          showImage(URL.createObjectURL(pendingImageBlob));
        } catch (err) {
          document.getElementById("status").textContent = err.message;
        }
      }

      async function removeImage(url) {
        if (!url) {
          return;
        }
        const marker = "/" + BUCKET + "/";
        const index = url.indexOf(marker);
        if (index === -1) {
          return;
        }
        const path = url.slice(index + marker.length);
        await db.storage.from(BUCKET).remove([path]);
      }

      // ---------- Download and reset ----------

      function downloadCard() {
        html2canvas(document.getElementById("card"), { useCORS: true }).then(function (canvas) {
          const link = document.createElement("a");
          link.download = "character-card.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        });
      }

      function newCharacter() {
        editingId = null;
        pendingImageBlob = null;
        currentImageUrl = null;
        showImage(null);
        document.getElementById("imageInput").value = "";
        document.getElementById("nameInput").value = "";
        document.getElementById("ageInput").value = "";
        document.getElementById("genderInput").value = "";
        document.getElementById("storyInput").value = "";
        document.getElementById("templateInput").value = "modern";
        document.getElementById("extraFields").textContent = "";
        document.getElementById("shareLink").value = "";
        document.getElementById("status").textContent = "";
        renderCard();
      }

      // ---------- Saving ----------

      async function saveCharacter() {
        const status = document.getElementById("status");

        if (!currentUser) {
          status.textContent = "Please log in with Discord first.";
          return;
        }

        const name = document.getElementById("nameInput").value.trim();
        if (name === "") {
          status.textContent = "Please give your character a name.";
          return;
        }

        status.textContent = "Saving...";

        const file = document.getElementById("imageInput").files[0];
        if (file && !pendingImageBlob) {
          try {
            pendingImageBlob = await resizeImage(file, 800);
          } catch (err) {
            status.textContent = err.message;
            return;
          }
        }

        const fields = {
          name: name,
          age: document.getElementById("ageInput").value.trim(),
          gender: document.getElementById("genderInput").value.trim(),
          backstory: document.getElementById("storyInput").value.trim(),
          template: getTemplate(),
          extra: getExtraFields()
        };

        let newImagePath = null;
        if (pendingImageBlob) {
          newImagePath = currentUser.id + "/" + crypto.randomUUID() + ".jpg";
          const upload = await db.storage
            .from(BUCKET)
            .upload(newImagePath, pendingImageBlob, { contentType: "image/jpeg" });

          if (upload.error) {
            status.textContent = "Could not upload the picture: " + upload.error.message;
            return;
          }

          fields.image_url = db.storage.from(BUCKET).getPublicUrl(newImagePath).data.publicUrl;
        }

        let result;
        if (editingId) {
          result = await db
            .from("characters")
            .update(fields)
            .eq("id", editingId)
            .select()
            .single();
        } else {
          result = await db
            .from("characters")
            .insert(fields)
            .select()
            .single();
        }

        if (result.error) {
          if (newImagePath) {
            await db.storage.from(BUCKET).remove([newImagePath]);
          }
          status.textContent = "Could not save: " + result.error.message;
          return;
        }

        if (pendingImageBlob) {
          if (currentImageUrl) {
            await removeImage(currentImageUrl);
          }
          currentImageUrl = fields.image_url;
          pendingImageBlob = null;
          document.getElementById("imageInput").value = "";
        }

        editingId = result.data.id;
        const link = window.location.origin + window.location.pathname + "?id=" + result.data.id;
        document.getElementById("shareLink").value = link;
        status.textContent = "Saved!";
        loadMyCharacters();
      }

      function copyLink() {
        const link = document.getElementById("shareLink").value;
        if (link !== "") {
          navigator.clipboard.writeText(link);
          document.getElementById("status").textContent = "Link copied!";
        }
      }

      // ---------- My characters ----------

      async function loadMyCharacters() {
        if (!currentUser) {
          return;
        }

        const list = document.getElementById("myList");
        const { data, error } = await db
          .from("characters")
          .select("id, name")
          .eq("owner_id", currentUser.id)
          .order("created_at", { ascending: false });

        list.textContent = "";

        if (error) {
          list.textContent = "Could not load: " + error.message;
          return;
        }

        if (!data || data.length === 0) {
          list.textContent = "No characters yet.";
          return;
        }

        data.forEach(function (character) {
          const row = document.createElement("div");
          row.className = "row";

          const nameSpan = document.createElement("span");
          nameSpan.textContent = character.name;

          const buttons = document.createElement("div");

          const editBtn = document.createElement("button");
          editBtn.className = "secondary";
          editBtn.textContent = "Edit";
          editBtn.onclick = function () {
            editCharacter(character.id);
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "danger";
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = function () {
            deleteCharacter(character.id);
          };

          buttons.appendChild(editBtn);
          buttons.appendChild(document.createTextNode(" "));
          buttons.appendChild(deleteBtn);
          row.appendChild(nameSpan);
          row.appendChild(buttons);
          list.appendChild(row);
        });
      }

      async function editCharacter(id) {
        const { data, error } = await db
          .from("characters")
          .select("*")
          .eq("id", id)
          .single();

        if (error || !data) {
          document.getElementById("status").textContent = "Could not load that character.";
          return;
        }

        editingId = data.id;
        pendingImageBlob = null;
        currentImageUrl = data.image_url;
        document.getElementById("imageInput").value = "";
        showImage(data.image_url);
        fillForm(data);
        document.getElementById("shareLink").value =
          window.location.origin + window.location.pathname + "?id=" + data.id;
        document.getElementById("status").textContent = "Editing " + data.name;
      }

      async function deleteCharacter(id) {
        if (!confirm("Delete this character? This can't be undone.")) {
          return;
        }

        const found = await db
          .from("characters")
          .select("image_url")
          .eq("id", id)
          .single();

        const { error } = await db
          .from("characters")
          .delete()
          .eq("id", id);

        if (error) {
          document.getElementById("status").textContent = "Could not delete: " + error.message;
          return;
        }

        if (found.data && found.data.image_url) {
          await removeImage(found.data.image_url);
        }

        if (editingId === id) {
          newCharacter();
        }
        loadMyCharacters();
      }

      // ---------- Viewing a shared link ----------

      async function loadCharacter() {
        const id = new URLSearchParams(window.location.search).get("id");
        if (!id) {
          return;
        }

        document.getElementById("authBox").style.display = "none";
        document.getElementById("viewerBox").style.display = "block";
        showImage(null);
        document.getElementById("cardName").textContent = "Loading...";
        document.getElementById("cardAge").textContent = "";
        document.getElementById("cardGender").textContent = "";
        document.getElementById("cardStory").textContent = "";
        document.getElementById("cardExtra").textContent = "";

        const { data, error } = await db
          .from("characters")
          .select("*")
          .eq("id", id)
          .single();

        if (error || !data) {
          document.getElementById("cardName").textContent = "Character not found";
          return;
        }

        showImage(data.image_url);
        fillForm(data);
      }

      showImage(null);
      renderCard();
      loadCharacter();
    </script>
  </body>
</html>
