<!DOCTYPE html>
<html>
  <head>
    <title>Character Card</title>
    <style>
      body {
        background-color: #1e1e2e;
        font-family: Arial, sans-serif;
      }
      .card {
        background-color: white;
        width: 300px;
        padding: 20px;
        border-radius: 12px;
        margin: 40px auto;
      }
      img {
        width: 100%;
        border-radius: 8px;
      }
      .form {
        background-color: white;
        width: 300px;
        padding: 20px;
        border-radius: 12px;
        margin: 40px auto;
      }
      .form input {
        display: block;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <img id="cardImage" src="kai.jpg" alt="Character picture">
      <h1 id="cardName">Kai</h1>
      <p>Age: <span id="cardAge">24</span></p>
      <p>Gender: <span id="cardGender">Male</span></p>
      <p>Backstory: <span id="cardStory">A wandering knight.</span></p>
    </div>

    <div class="form" id="formBox">
      <input id="nameInput" placeholder="Name">
      <input id="ageInput" placeholder="Age">
      <input id="genderInput" placeholder="Gender">
      <input id="storyInput" placeholder="Backstory">
      <input id="imageInput" type="file" accept="image/*">
      <button onclick="updateCard()">Update card</button>
      <button onclick="downloadCard()">Download card as image</button>
      <button onclick="saveCharacter()">Save and get link</button>
      <p id="status"></p>
      <input id="shareLink" readonly placeholder="Your share link appears here">
      <button onclick="copyLink()">Copy link</button>
    </div>

    <div class="form" id="viewerBox" style="display: none;">
      <button onclick="downloadCard()">Download card as image</button>
      <p><a href="./">Make your own card</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      const SUPABASE_URL = "https://zztddikhhoiiquygszmu.supabase.co";
      const SUPABASE_KEY = "sb_publishable_4voRPIIlS73ex4K8woa0ow_Nbzwbxq7";
      const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      function setText(cardId, inputId) {
        const value = document.getElementById(inputId).value;
        if (value !== "") {
          document.getElementById(cardId).textContent = value;
        }
      }

      function updateCard() {
        setText("cardName", "nameInput");
        setText("cardAge", "ageInput");
        setText("cardGender", "genderInput");
        setText("cardStory", "storyInput");

        const file = document.getElementById("imageInput").files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.getElementById("cardImage").src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      }

      function downloadCard() {
        html2canvas(document.getElementById("card")).then(function (canvas) {
          const link = document.createElement("a");
          link.download = "character-card.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        });
      }

      async function saveCharacter() {
        const status = document.getElementById("status");
        status.textContent = "Saving...";

        const { data, error } = await db
          .from("characters")
          .insert({
            name: document.getElementById("cardName").textContent,
            age: document.getElementById("cardAge").textContent,
            gender: document.getElementById("cardGender").textContent,
            backstory: document.getElementById("cardStory").textContent
          })
          .select()
          .single();

        if (error) {
          status.textContent = "Could not save: " + error.message;
          return;
        }

        const link = window.location.origin + window.location.pathname + "?id=" + data.id;
        document.getElementById("shareLink").value = link;
        status.textContent = "Saved!";
      }

      function copyLink() {
        const link = document.getElementById("shareLink").value;
        if (link !== "") {
          navigator.clipboard.writeText(link);
          document.getElementById("status").textContent = "Link copied!";
        }
      }

      async function loadCharacter() {
        const id = new URLSearchParams(window.location.search).get("id");
        if (!id) {
          return;
        }

        document.getElementById("formBox").style.display = "none";
        document.getElementById("viewerBox").style.display = "block";
        document.getElementById("cardName").textContent = "Loading...";
        document.getElementById("cardAge").textContent = "";
        document.getElementById("cardGender").textContent = "";
        document.getElementById("cardStory").textContent = "";

        const { data, error } = await db
          .from("characters")
          .select("*")
          .eq("id", id)
          .single();

        if (error || !data) {
          document.getElementById("cardName").textContent = "Character not found";
          return;
        }

        document.getElementById("cardName").textContent = data.name;
        document.getElementById("cardAge").textContent = data.age;
        document.getElementById("cardGender").textContent = data.gender;
        document.getElementById("cardStory").textContent = data.backstory;
      }

      loadCharacter();
    </script>
  </body>
</html>
